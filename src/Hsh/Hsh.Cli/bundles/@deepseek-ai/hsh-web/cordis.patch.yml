# hsh-web bundle: the Phase-5 Blazor shell served by the gateway host.
# Order matters: webCore creates the slot/page-assembly registries, the ui-* rows register their
# contributions into them, and webHost maps last so the endpoint-level route table knows every
# page assembly.
- insert:
    - id: rpc
      name: rpc

    - id: webCore
      name: webCore

    - id: approval
      name: approval

    - id: userQuestions
      name: userQuestions

    - id: toolAskUser
      name: toolAskUser

    - id: uiSidebar
      name: uiSidebar

    - id: uiSessions
      name: uiSessions

    - id: uiChat
      name: uiChat

    - id: uiWorkspace
      name: uiWorkspace

    - id: uiSettings
      name: uiSettings

    - id: uiPlan
      name: uiPlan

    - id: uiApproval
      name: uiApproval

    - id: webHost
      name: webHost
      config:
        host: 127.0.0.1
        port: 3080
