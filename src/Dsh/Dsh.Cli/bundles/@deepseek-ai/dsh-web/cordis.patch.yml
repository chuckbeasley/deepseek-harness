      name: rpc

    - id: webHost
      name: webHost

    - id: uiSidebar
      name: uiSidebar

    - id: uiSessions
      name: uiSessions

    - id: uiChat
      name: uiChat

    - id: uiWorkspace
      name: uiWorkspace
