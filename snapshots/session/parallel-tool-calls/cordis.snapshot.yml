# Keyless filesystem snapshots combine spill settings with replay. The
# sandboxed filesystem stack already lives in `hsh-base`; the ACP row re-pins
# `deepseek-v4-flash` for the recorded corpus.
- id: llm-deepseek
  name: '@deepseek-ai/hsh-llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/hsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/hsh-session-persistence-jsonl'
  config:
    root: !!js hshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/hsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/hsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/hsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: spill-local
  name: '@deepseek-ai/hsh-spill-local'
  config:
    root: !!js process.env.HSH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@deepseek-ai/hsh-spill-policy'
  config:
    maxInlineBytes: 800
