# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `hsh-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@deepseek-ai/hsh-spill-local'
  config:
    root: !!js process.env.HSH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@deepseek-ai/hsh-spill-policy'
  config:
    maxInlineBytes: !!js process.env.HSH_SNAPSHOT && 800 || 50000
