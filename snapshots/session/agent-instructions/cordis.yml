# Workspace-context snapshot patch: keep project-root and user-global
# discovery inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@deepseek-ai/hsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@deepseek-ai/hsh-session-persistence-jsonl'
  config:
    root: !!js hshHomePath('sessions')
    compression: !!js 'process.env.HSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@deepseek-ai/hsh-agent-instructions'
  config:
    maxBytes: 65536
    hshHome: !!js process.cwd() + '/.hsh'
    projectRootMarkers:
      - .hsh-project

- id: system-prompt
  name: '@deepseek-ai/hsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
