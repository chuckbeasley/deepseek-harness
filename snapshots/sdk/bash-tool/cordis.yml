# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@deepseek-ai/hsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@deepseek-ai/hsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/hsh-session-persistence-jsonl'
  config:
    root: !!js hshHomePath('sessions')
    compression: !!js "process.env.HSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@deepseek-ai/hsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
